name: BIA LAB-42 Deno Typecheck

on:
  push:
    branches:
      - 'lab/bia-neo-safe-filters-20261014'
    paths:
      - '.github/workflows/bia-lab42-deno-typecheck.yml'

permissions:
  contents: read

concurrency:
  group: bia-lab42-deno-typecheck
  cancel-in-progress: false

jobs:
  check-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated BIA branch
        uses: actions/checkout@v4

      - name: Install Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Print Deno version
        run: deno --version

      - name: Typecheck BIA-only Edge Function without execution
        run: deno check --node-modules-dir=auto lab/bia-neo/edge-candidate/index.ts

      - name: Exercise actual BIA handler with fake credentials and offline catalogue
        run: deno test --node-modules-dir=auto --allow-env lab/bia-neo/edge-candidate/index.test.ts
