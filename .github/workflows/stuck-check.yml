# Reprocessado em 2026-07-14 pra forçar o GitHub a reindexar os gatilhos
# (cache de trigger ficou inconsistente após commits recentes no arquivo).
name: Verificar clientes sem resposta

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar healthcheck de conversas travadas
        run: curl -s -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://ignite-webhook.vercel.app/api/system-tools?tool=stuck-check"
