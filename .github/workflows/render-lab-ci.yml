name: Render Lab CI

on:
  push:
    branches:
      - render-lab
      - 'lab/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Critical Story tests
        run: npx vitest run api/__tests__/storyVideoSmartVision.test.js api/__tests__/storyCatalogMatchingFix.test.js api/__tests__/productUniverseContract.test.js api/__tests__/productUniverseRuntime.test.js api/__tests__/supplierShadowV1.test.js api/__tests__/supplierVisionWorkerV1.test.js api/__tests__/supplierVisionExecutionIdentity.test.js api/__tests__/supplierDriveScannerV1.test.js api/__tests__/supplierCatalogCycleV1.test.js api/__tests__/supplierHomologationHarnessV1.test.js api/__tests__/supplierHomologationHarnessBootV1.test.js api/__tests__/supplierHomologationPromotionBootV1.test.js

      - name: Full suite baseline observation
        continue-on-error: true
        run: npm test -- --run
