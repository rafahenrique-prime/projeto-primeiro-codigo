name: Render Lab CI

on:
  push:
    branches:
      - render-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-lab-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run
